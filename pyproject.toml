[project]
name = "page-pulse"
version = "1.0.0"
description = "Facebook page analytics that show their working"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "PyJWT>=2.10.0",
    "bcrypt>=4.2.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]
postgres = [
    "psycopg[binary]>=3.2.0",
]

[project.urls]
Homepage = "https://github.com/mohdabrarbaloch-arch/facebook-page-analyzer"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # FastAPI's dependency-injection signature style trips this rule.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Tests import the app after setting environment variables, which needs the
# import to sit below the assignments.
"tests/*" = ["E402"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.fastapi.static]
cdn = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
]
